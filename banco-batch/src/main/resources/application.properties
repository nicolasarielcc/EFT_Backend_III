spring.application.name=banco-batch
server.port=8080

# ===================== MySQL (docker-compose) =====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/banco_xyz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crear las tablas de negocio (schema.sql) en cada arranque (idempotente)
spring.sql.init.mode=always

# Ejecutar los 3 jobs automaticamente al iniciar (env BATCH_RUN_ON_STARTUP=true en Docker)
batch.run-on-startup=${BATCH_RUN_ON_STARTUP:false}

# ===================== Rutas de los CSV legacy (fin_legacy_data) =====================
batch.data.movimientos=data/movimientos_financieros_diarios.csv
batch.data.intereses=data/intereses_trimestrales.csv
batch.data.estados-anuales=data/estados_financieros_anuales.csv

# ===================== Escalado y tolerancia a fallos =====================
batch.chunk-size=50
batch.skip-limit=1000000
batch.retry-limit=3

# Pool de hilos para procesamiento paralelo (pool.core=max=1 => secuencial)
batch.pool.core=${BATCH_POOL_CORE:4}
batch.pool.max=${BATCH_POOL_MAX:8}
batch.pool.queue=100

# ===================== Spring Batch =====================
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

logging.level.cl.duoc.banco.bff=INFO
