spring.application.name=ms-cuentas
server.port=8092

# Configuracion centralizada (Spring Cloud Config)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# MySQL (docker-compose)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/banco_xyz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad (OAuth 2.0 resource server)
app.security.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# Mensajeria (Kafka)
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Service Discovery (Eureka)
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

logging.level.cl.duoc.banco.bff=INFO
